{% extends "base.html" %}

{% block title %}Global Search - YouTube Transcriber{% endblock %}

{% block content %}
<div class="page-head">
    <p class="kicker mb-1">Research</p>
    <h1 class="page-title">Global Search</h1>
    <p class="page-subtitle">Search every ingested transcript and summary across the full video corpus.</p>
</div>

<div class="surface mb-6">
    <div class="surface-body">
        <form hx-post="/api/global-search"
              hx-target="#global-search-results"
              hx-trigger="submit"
              hx-indicator="#global-search-loading">
            <div class="grid gap-3">
                <div class="flex gap-2">
                    <input type="text" id="global-search-query" name="query" placeholder="Search all videos..."
                           hx-post="/api/global-search"
                           hx-target="#global-search-results"
                           hx-trigger="keyup changed delay:700ms"
                           hx-include="#global-search-form-fields"
                           class="input-field flex-1"
                           autofocus>
                    <button type="submit" class="btn btn-primary">
                        <i class="iconoir-search" style="font-size:0.9rem"></i> Search
                    </button>
                </div>
                <div id="global-search-form-fields" class="flex flex-wrap gap-2 items-center">
                    <select name="source_type" class="input-field" style="max-width: 180px;">
                        <option value="all">All sources</option>
                        <option value="transcript">Transcripts</option>
                        <option value="summary">Summaries</option>
                    </select>
                    <select name="limit" class="input-field" style="max-width: 140px;">
                        <option value="12">12 results</option>
                        <option value="20">20 results</option>
                        <option value="30">30 results</option>
                    </select>
                    <select name="per_video_limit" class="input-field" style="max-width: 180px;">
                        <option value="3">3 per video</option>
                        <option value="1">1 per video</option>
                        <option value="5">5 per video</option>
                    </select>
                </div>
            </div>
        </form>
    </div>
</div>

<span id="global-search-loading" class="htmx-indicator inline-flex items-center gap-2 mb-4">
    <span class="spinner spinner-sm"></span>
    <span class="text-sm text-muted">Searching full corpus...</span>
</span>

<div id="global-search-results" class="space-y-4"></div>
{% endblock %}

{% block scripts %}
<script>
const qs = new URLSearchParams(window.location.search);
const q = qs.get('q');
const globalSearchInput = document.getElementById('global-search-query');
if (q && globalSearchInput) {
    globalSearchInput.value = q;
    htmx.ajax('POST', '/api/global-search', {
        values: {query: q},
        target: '#global-search-results',
        swap: 'innerHTML'
    });
}
</script>
{% endblock %}
